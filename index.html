<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Sokoban</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="console">
    <h1 class="console-title">Sokoban</h1>

    <div class="hud-row">
      <button class="hud-btn" id="back-btn" hidden>☰ 목록</button>
      <span class="hud-stat" id="hud-stage-name">스테이지 선택</span>
      <span class="hud-stat" id="hud-moves"></span>
      <span class="hud-stat" id="hud-time"></span>
    </div>

    <div class="screen-bezel">
      <div id="canvas-wrap">
        <canvas id="game-canvas" width="480" height="480"></canvas>

        <!-- 스테이지 선택 메뉴: 게임기 액정 위에 표시된다 -->
        <div class="menu-screen" id="menu-screen">
          <div class="menu-heading">STAGE SELECT</div>
          <div class="stage-grid" id="stage-grid"></div>
        </div>

        <div class="result-overlay" id="result-overlay" hidden>
          <div class="result-card">
            <div class="result-title">STAGE CLEAR!</div>
            <div class="result-stat">이동 횟수: <span id="result-moves"></span></div>
            <div class="result-stat">걸린 시간: <span id="result-time"></span></div>
            <div class="result-best" id="result-best" hidden>신기록!</div>
            <div class="result-buttons">
              <button id="result-retry">Retry</button>
              <button id="result-next">Next</button>
              <button id="result-select">목록</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="status-row">
      <span class="power-led"></span>
      <span class="power-label">POWER</span>
    </div>

    <div class="controls-row">
      <div class="dpad" id="dpad">
        <button class="dpad-btn dpad-up" data-dir="up"><span class="tri tri-up"></span></button>
        <button class="dpad-btn dpad-left" data-dir="left"><span class="tri tri-left"></span></button>
        <div class="dpad-center"></div>
        <button class="dpad-btn dpad-right" data-dir="right"><span class="tri tri-right"></span></button>
        <button class="dpad-btn dpad-down" data-dir="down"><span class="tri tri-down"></span></button>
      </div>

      <div class="action-panel">
        <div class="action-grid">
          <button id="undo-btn" class="action-btn" title="Undo">Undo</button>
          <button id="redo-btn" class="action-btn" title="Redo">Redo</button>
          <button id="reset-btn" class="action-btn reset-btn" title="Reset level">Reset</button>
          <button id="fullscreen-btn" class="action-btn fullscreen-btn" title="Fullscreen">⛶</button>
        </div>
        <div class="start-select">START / SELECT</div>
      </div>

      <div class="speaker-grille">
        <span></span><span></span><span></span>
        <span></span><span></span><span></span>
        <span></span><span></span><span></span>
      </div>
    </div>
  </div>

  <script src="js/map.js"></script>
  <script src="js/game.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
